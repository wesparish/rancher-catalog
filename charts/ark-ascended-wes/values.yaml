# Default values for ark-ascended-wes.

# Pinned by digest deliberately. The tag was `latest` with pullPolicy: Always, which meant the
# server binary could change under you on any restart -- and a bad upstream push looked identical
# to a Wildcard patch failure. `tag` is kept only as a human-readable label; `digest` is what
# actually resolves. To upgrade: pull the new digest, update it here, commit.
image:
  repository: sknnr/ark-ascended-server
  tag: latest
  digest: "sha256:a2e1fa4971d79e8d31890012143029022e486b7924dcb9963e3df7a190527043"
  pullPolicy: IfNotPresent

# Floats across any node that can mount the cephfs volume. This server needs a specific outbound
# path, which egress.markPorts below arranges per-pod, so no host pinning is required -- read
# README.md before changing either.
nodeSelector:
  ceph-client: "true"

# Marks this server's outbound HTTPS with a distinctive source port range so the network can give it
# the routing it needs regardless of which node it lands on. Without it the pod inherits whatever
# outbound path its node has, and the server registers an address players cannot reach: it appears
# in the in-game browser but nobody can join, while direct connect keeps working and nothing logs
# an error. This is what removes the need to pin the pod to a host.
#
# The range is deliberately ABOVE Linux's default ephemeral range (32768-60999). A range inside it
# would mean other workloads' random source ports occasionally land in ours and get the same
# treatment -- a silent surprise for anything relying on the default path.
egress:
  # Separate switch from markPorts so the two can be isolated when debugging. markPorts only works
  # with this enabled; enabling this alone is a valid configuration for testing.
  hostNetwork: true
  markPorts:
    enabled: true
    range: "61000-61999"
    # Scopes the rule to this server's socket owner so other workloads on the node are untouched.
    # Must match the pod's runAsUser. Nothing else on these nodes should run host-network processes
    # as this uid -- if something does, its outbound TCP takes the same path.
    ownerUid: 10000
    chain: ARK_EGRESS
    # Needs iptables and curl.
    image: nicolaka/netshoot:latest
  # This whole mechanism rests on the node's masquerade preserving the source port, which is
  # best-effort -- on collision it reallocates and that connection quietly takes the default path.
  # Nothing in the game surfaces that, so this logs the address the pod actually appears as.
  verify:
    enabled: true
    intervalSeconds: 300
    url: https://ifconfig.me
    # Intentionally empty here: this file is public, so the address is supplied at deploy time
    # instead --  `helm upgrade ... --set egress.verify.expectedAddress=<addr>`, or a local values
    # override kept out of git. With it set, a mismatch is logged as "UNEXPECTED"; without it the
    # sidecar just reports what it observes and makes no claim.
    expectedAddress: ""

resources:
  requests:
    cpu: 2
    memory: 12Gi
  limits:
    cpu: 4
    memory: 20Gi

persistence:
  # Created out-of-band by storage/ark-ascended.yaml (applied before this chart -- and, once argocd
  # is actually live, ahead of it via the "storage" Application's sync-wave). Covers the whole ARK
  # install dir, not just Saved, so a pod restart/reschedule doesn't re-download the entire game
  # through steamcmd.
  existingClaim: ark-ascended-data

service:
  type: LoadBalancer
  # Free address in the metallb 172.16.1.220-240 pool. ark-wes (ASE) holds .233.
  loadBalancerIP: "172.16.1.238"

# Passwords are never stored in this file. Create the Secret out-of-band before installing:
#
#   kubectl create secret generic ark-ascended-server -n ark-ascended \
#     --from-literal=server-admin-password='...' \
#     --from-literal=server-password=''
#
# An empty server-password means no join password (public server).
existingSecret: ark-ascended-server
secretKeys:
  serverAdminPassword: server-admin-password
  serverPassword: server-password

env:
  # MUST NOT contain spaces. The image's entrypoint interpolates SESSION_NAME into a single
  # `?`-delimited launch string and then expands that string *unquoted* into `proton run ...`, so a
  # space word-splits it into separate argv elements and ARK parses `?` options from the first one
  # only -- silently dropping every setting after the space. See README.md.
  sessionName: "WTopAce_Ascended_Island"
  serverMap: TheIsland_WP
  # 7778 rather than the ASA default 7777, which satisfactory already uses. Nothing clashes inside
  # the cluster (separate LoadBalancer IPs); keeping one port end-to-end just avoids translating it.
  gamePort: 7778
  rconPort: 27020

  # CurseForge project IDs, verified against curseforge.com 2026-07-27. See README.md for the full
  # ASE -> ASA mapping, including Dino Tracker which has no ASA port at all:
  #   947033   Awesome Spyglass!                    (ASE: Awesome SpyGlass!)
  #   950914   Awesome Teleporters!                 (ASE: Awesome Teleporters!)
  #   929578   AP: Death Recovery [Cross-platform]  (ASE: Automatic Death Recovery, same author)
  #   942024   Dino Depot                           (ASE: Dino Storage v2 -- substitute, not a port)
  #   1086659  AP+ Revive My Dino                   (ASE: Revive my dino)
  #
  # Mods download on the pod start after they change, so expect a slow first boot. A bad ID fails
  # at startup in ways that look like storage or network problems -- check the launch string and
  # the steamcmd/mod download lines in the pod log before suspecting anything else.
  mods: "947033,950914,929578,942024,1086659"

  # Deliberately empty -- see gameUserSettingsIni below. Launch args are fragile in this image
  # (unquoted expansion) and ARK does not persist them to disk, so [ServerSettings] is managed as
  # a file instead. Anything added here is appended to the same brittle launch string.
  extraSettings: ""
  extraFlags: ""

# Readiness is measured on the RCON port, not the game port: the game port is UDP and a TCP dial
# proves nothing there. RCON only starts listening once ARK has finished loading the map, so it is
# the earliest honest "joinable" signal available without an RCON client in the probe.
#
# There is deliberately NO livenessProbe. ARK stalls for minutes under heavy save/load on a busy
# map, and a liveness probe would restart it mid-save -- which is how save corruption happens.
# Readiness only pulls it out of the LoadBalancer's endpoints; it never kills the pod.
#
# startupProbe carries the long boot (steamcmd validate + mod downloads + map load). failureThreshold
# 60 x periodSeconds 30 = 30 minutes before the pod is declared failed.
probes:
  enabled: true
  startup:
    periodSeconds: 30
    failureThreshold: 60
  readiness:
    periodSeconds: 30
    failureThreshold: 4

# Self-healing steamcmd update, run as an initContainer BEFORE the game container.
#
# Why this exists: the upstream image's entrypoint.sh runs `app_update 2430930 validate` with a
# hard `exit 1` on failure, and offers no flag to skip or soften it. When Wildcard publishes a new
# build, Steam stops issuing manifest request codes for the superseded manifest to anonymous
# logins, so validate fails with 'Access Denied' (logged misleadingly as "No connection"). The
# failure is persisted into the PVC as UpdateResult=6, so every subsequent restart replays it
# identically -- an unrecoverable CrashLoopBackOff that a plain restart can never clear. This
# happened 2026-08-22; the server had been on build 24388897 since 2026-07-27 while current was
# 24827022.
#
# The recovery is exactly the manual repair: drop the stale appmanifest and re-acquire. Once this
# initContainer succeeds, the game container's own unconditional validate finds everything current
# and is a fast no-op.
#
# Cost when the fallback fires: a full ~13GB re-download, so boot takes a while. That is the
# deliberate tradeoff against being down until a human notices.
steamUpdate:
  enabled: true

# Local backup rotation. Deliberately NOT offsite -- borg-wes is suspended (its target
# j-dock1.weshouse has been unreachable since 2026-07-15) and offsite was explicitly out of scope
# for now.
#
# LIMITATION, on purpose: backups land on the same cephfs volume as the world they protect. This
# covers "I need yesterday's save back" and ARK-side corruption; it does NOT cover losing the
# volume. Point `claim` at a separate PVC when that matters.
#
# Retention is grandfather-father-son: the daily archive is promoted into weekly/ on Sundays and
# into monthly/ on the 1st, then each tier is pruned to its own count.
backup:
  enabled: true
  # 04:00 daily -- off-peak, and clear of ARK's own 15-minute autosave rotation.
  schedule: "0 4 * * *"
  image: busybox:1.36
  # Path RELATIVE to the root of the data volume -- the backup job mounts that volume at /data,
  # not at the game's /home/steam/ark, so an absolute game-side path would not resolve here.
  # Sits alongside ShooterGame/, not inside it, so a steamcmd validate never touches it.
  path: Backups
  claim: ""
  retention:
    daily: 7
    weekly: 4
    monthly: 6

# GameUserSettings.ini [ServerSettings] -- written to disk by an initContainer on every pod start,
# same as gameIni below. This is where server settings live rather than in `extraSettings` launch
# args, because the image drops most of those (see env.sessionName).
#
# The image's entrypoint only creates this file when it is absent, and otherwise only rewrites the
# RCON lines, so a file written here survives. RCONEnabled/RCONPort are repeated here to match what
# the entrypoint expects to find.
#
# NOTE: because this is rewritten every start, settings changed in-game or by an admin are reverted
# on the next restart. Change values.yaml instead. Only the headline settings are declared; the
# rest of the old ASE GameUserSettingsIni block still hasn't been audited against ASA defaults.
gameUserSettingsIni: |
  [ServerSettings]
  RCONEnabled=True
  RCONPort=27020
  TamingSpeedMultiplier=40.0
  XPMultiplier=4.0
  ServerPVE=True

# Settings that only exist in Game.ini [/script/shootergame.shootergamemode] and have no launch-arg
# equivalent -- written to disk by an initContainer on every pod start. Per-level stat multiplier
# arrays were deliberately left out (left at ASA default; revisit later if taming/breeding gets too
# easy).
#
# UseCorpseLifeSpanMultiplier=672 is a 7-day corpse/death-cache timer: the multiplier scales the
# vanilla 15-minute lifespan, so 672 * 15 min = 10080 min = 7 days (it was 25.0, ~6.25 h). It
# covers dropped death caches and bodies, player and dino. No comment lines inside the ini block --
# the Unreal config parser only treats ';' as a comment, so keep annotations out here.
gameIni: |
  [/script/shootergame.shootergamemode]
  DinoHarvestingDamageMultiplier=3.200000
  TamedDinoCharacterFoodDrainMultiplier=0.250000
  UseCorpseLifeSpanMultiplier=672.000000
  CraftXPMultiplier=2.000000
  GenericXPMultiplier=2.000000
  HarvestXPMultiplier=2.000000
  KillXPMultiplier=4.000000
