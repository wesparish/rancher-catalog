apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plex-downloads-wes.fullname" . }}-nginx-conf
  labels:
    {{- include "plex-downloads-wes.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen       8080;
        server_name  _;

        root /data;

        charset utf-8;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Media files can be huge -- no body size limit here, and let clients resume
        # downloads instead of restarting from zero.
        client_max_body_size 0;

        location / {
            try_files $uri $uri/ =404;
        }
    }
